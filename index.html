<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>병 속의 한 줄</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=East+Sea+Dokdo&family=Gowun+Batang:wght@400;700&family=Hi+Melody&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <section class="hero">
      <header>
        <h1>병 속의 한 줄</h1>
        <p class="intro">오늘 배운 것을 편지에 적어 병에 담고, 바다로 띄워 보내요.</p>
      </header>

      <div class="stage" id="stage">
        <div class="drift">
          <div class="bottle">
            <div class="cork" aria-hidden="true"></div>
            <div class="neck" aria-hidden="true"></div>
            <div class="body">
              <form id="entry-form" class="paper">
                <label for="nickname">보내는 사람</label>
                <input id="nickname" name="nickname" maxlength="20" required
                       placeholder="실명 대신 별명이나 번호">

                <label for="content">오늘 배운 것 한 줄</label>
                <textarea id="content" name="content" maxlength="100" rows="3" required
                          placeholder="예: 분모를 같게 만들고 더한다"></textarea>

                <button type="submit">병에 담아 띄우기</button>
              </form>
              <div class="scroll" aria-hidden="true"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="waves" aria-hidden="true">
        <div class="wave wave-back"></div>
        <div class="wave wave-front"></div>
      </div>
    </section>

    <section class="sea">
      <h2>바다에 떠 있는 병 <span id="count"></span></h2>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <ul id="entry-list" class="entries"></ul>
    </section>
  </main>

  <!-- 6부에서 Supabase를 연결할 때 이 자리에 Supabase 스크립트 한 줄이 추가됩니다 -->
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
